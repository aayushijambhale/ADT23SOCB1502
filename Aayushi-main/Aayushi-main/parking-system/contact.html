<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - ParkVehi</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <div class="logo">
                <a href="#">
                    <img src="http://www.yellowhaven.com/images/1024px-Parking_icon.svg-copy.png" alt="logo">
                </a>
                <a href="#">PARK</a>
                <a href="#" style="color:white;">VEHI</a>
            </div>
            <a href="index.html">Home</a>
        </div>
        <div class="content">
            <div class="hero">
                <h2>Contact Us</h2>
                <p>Have questions? Reach out to us through our contact form or email.</p>
            </div>
            <div class="form-container">
                <form action="submit_contact.php" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <div class="form-group">
                        <input type="submit" value="Send Message">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
